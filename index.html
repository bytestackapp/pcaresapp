<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PCaresApp</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="/favicon.png?v=2" type="image/png">
  <link rel="stylesheet" href="/css/global.css">
  <style>
    #splashOverlay {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 1.5rem 110px;
      background: linear-gradient(115deg, #ffffff 50%, #eaf2fb 100%);
      transition: opacity .4s ease;
    }
    #splashOverlay.hide { opacity: 0; pointer-events: none; }

    .sp-logo { display: block; width: 220px; max-width: 70vw; height: auto; }

    .sp-bar {
      margin-top: 2rem; width: 180px; height: 4px; border-radius: 2px;
      background: #dfe6ee; overflow: hidden; position: relative;
    }
    .sp-bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 2px;
      background: #066fd1;
    }
    #splashOverlay.run .sp-bar::after { animation: spFill var(--splash-ms, 5000ms) linear forwards; }
    @keyframes spFill { 0% { width: 0; } 20% { width: 18%; } 55% { width: 62%; } 80% { width: 86%; } 100% { width: 100%; } }

    .sp-powered {
      position: absolute; left: 0; right: 0; bottom: 64px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: .78rem; color: #646464;
    }
    .sp-powered img { height: 34px; width: auto; display: block; }

    .sp-version {
      position: absolute; left: 0; width: 100%; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      text-align: center; font-size: .75rem; line-height: 1.5; color: #7c7c7c;
      border-top: 1px solid #e6e7e9; padding-top: 10px; max-width: 420px; left: 50%; transform: translateX(-50%);
    }
  </style>
</head>
<body class="splash-body public">
  <div id="splashOverlay" aria-busy="true">
    <img id="splashLogo" class="sp-logo" src="/image/logo.png" alt="PhilHealth">

    <div class="sp-bar" role="status" aria-label="Loading"></div>

    <div class="sp-powered">
      <span>Powered by</span>
      <img src="/image/bytestack.png" alt="Bytestack">
    </div>

    <div class="sp-version">
      <div id="splashVersion"></div>
      <div>&copy; <span id="splashYear">2026</span> Bytestack. All Rights Reserved.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/splash.js"></script>
</body>
</html>
