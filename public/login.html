<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · LogSheet</title>
  <meta name="theme-color" content="#3B8526">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/image/logo.png">
  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/theme.js"></script>
</head>
<body class="public">
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/image/logo.png" alt="" id="brandLogo">
        <h1 id="brandName">LogSheet</h1>
        <p id="brandTag"></p>
      </div>

      <!-- Sign in -->
      <section id="panelLogin">
        <div id="loginAlert" class="alert" hidden></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label class="label" for="username">Username</label>
            <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your username" required>
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <div class="input-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
              <button type="button" class="toggle-btn" data-pw-toggle="password" aria-label="Show password"></button>
            </div>
          </div>
          <div class="field">
            <span class="label" id="hospLabel">Hospital</span>
            <button type="button" class="select-btn" id="hospitalBtn" aria-labelledby="hospLabel" aria-haspopup="dialog">
              <span class="sel-text">Select your hospital</span><span id="hospChevron"></span>
            </button>
          </div>
          <div class="row" style="justify-content:flex-end;margin:-.25rem 0 1rem">
            <button type="button" class="link-btn" id="forgotLink">Forgot password?</button>
          </div>
          <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Sign in</button>
        </form>
        <div class="divider">New here?</div>
        <a class="btn btn-ghost btn-block" href="/public/signup.html">Create an account</a>
        <div class="auth-links">
          <button type="button" id="aboutLink">About</button>
          <button type="button" id="privacyLink">Privacy</button>
        </div>
      </section>

      <!-- Forgot password -->
      <section id="panelForgot" hidden>
        <button type="button" class="back-link" id="backToLogin"></button>
        <h2 style="font-size:1.2rem;margin-bottom:.25rem">Reset your password</h2>
        <p class="muted">Enter the email address on your account and we will send you a reset link.</p>
        <div id="forgotAlert" class="alert" hidden></div>
        <form id="forgotForm" novalidate>
          <div class="field">
            <label class="label" for="forgotEmail">Email address</label>
            <input class="input" id="forgotEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <button class="btn btn-primary btn-block" id="forgotBtn" type="submit">Send reset link</button>
        </form>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
