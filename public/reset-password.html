<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PCares App · Reset password</title>
  <meta name="theme-color" content="#3B8526">
  <link rel="icon" href="/favicon.png?v=2" type="image/png">
  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/theme.js"></script>
</head>
<body class="public">
  <main class="auth-page">
    <div class="auth-card">
      <h2 style="font-size:1.2rem;margin-bottom:1.5rem">Reset your password</h2>
      <p class="muted">Choose a new password. Use at least 8 characters and one you have not used before.</p>
      <div id="resetAlert" class="alert" hidden></div>
      <form id="resetForm" novalidate hidden onsubmit="return false">
        <div class="field" style="margin-top:1rem">
          <label class="label" for="newPw">New password</label>
          <div class="input-wrap">
            <input class="input" id="newPw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
            <button type="button" class="toggle-btn" data-pw-toggle="newPw" aria-label="Show password"></button>
          </div>
        </div>
        <div class="field">
          <label class="label" for="newPw2">Confirm new password</label>
          <div class="input-wrap">
            <input class="input" id="newPw2" type="password" autocomplete="new-password" placeholder="Re-enter password" required>
            <button type="button" class="toggle-btn" data-pw-toggle="newPw2" aria-label="Show password"></button>
          </div>
        </div>
        <div class="btn-row">
          <a class="btn btn-muted" href="/public/login.html">Back</a>
          <button class="btn btn-primary" id="resetBtn" type="submit">Update password</button>
        </div>
      </form>
      <a class="btn btn-ghost btn-block" id="backBtn" href="/public/login.html" style="margin-top:1rem" hidden>Back to sign in</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/logic.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/reset.js"></script>
</body>
</html>
